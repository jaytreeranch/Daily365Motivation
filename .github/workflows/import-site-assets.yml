name: import-site-assets
on:
  push:
    paths:
      - '.github/workflows/import-site-assets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import approved production assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --silent --show-error 'https://uc1e0d8bb6d5bde83b399134c92d.dl.dropboxusercontent.com/cd/0/get/DI7WNeU01U-myrh_2EiJbf0LuIyQhubq3k9eJwOXFTGFVHCuiea7xo8MdxLj2TP5kzeahxLJg7u38xSkns67CWYaxWeKL9FSSAUswLE-Ef2JE-4TOhyQudrCA2LzZQ8Uph7G_YnM4HZGsBRbI1CECPnwhJwCmxW0geDOCIRVFlM1LQ/file?c_luid=b7c2f533' -o 'assets/story-sc001.png'
          curl -L --fail --silent --show-error 'https://ucd429e75ef360b7602b80e6d9b5.dl.dropboxusercontent.com/cd/0/get/DI7ZCWkmMCv7SEvTH0GytRZ4ZfF6AoXWuJIXO9iySOAHhjYIO67hA8smg0qQClay3JaUjP6KmHvJZpJw5T1yE4FrN2ewQfh8BuWZvTbd3GzAQ-vSM4AFMljSoMevG1TIj5ZTTE7-pFWVOsQhrhtJYLzu4OUJ-ExvVCWFsEkAQA75qA/file?c_luid=b7c2f533' -o 'assets/story-sc003.png'
          curl -L --fail --silent --show-error 'https://ucc0673d5f54f33a17ec69cc494f.dl.dropboxusercontent.com/cd/0/get/DI6nEnGvGEZpSDKMM608dtQX759KF-8wx7zN2PZspxOrZZ8m5ao_RDknRVWoCync81drTkOeetP4RoBho3i7y_e45GX4gLME6SQsVNQo3ZJmXzyVApMnjnZLDBYiqnx5ov_hFbFgfy1JAL3XRuDQ2wfyJr73TZCygTXQCE_hWMDhaQ/file?c_luid=b7c2f533' -o 'assets/story-sc005.png'
          file assets/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Mirror approved production art for website" || exit 0
          git push origin main
